[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ail-lang"
version = "0.1.0"
description = "The AIL compiler"
requires-python = ">=3.12"
license = {text = "MIT OR Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.scripts]
ail = "ail_lang.ail_chatgpt:main"

[tool.setuptools]
include-package-data = false
package-dir = {ail_lang = "AIL_CURRENT"}
packages = ["ail_lang"]
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
